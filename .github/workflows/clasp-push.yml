name: Deploy to Apps Script

on:
  push:
    branches:
      - main
      - claude/**
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.github/workflows/clasp-push.yml'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "ERROR: CLASPRC_JSON secret no está configurado." >&2
            echo "Genera ~/.clasprc.json con 'clasp login' y guárdalo como secret CLASPRC_JSON." >&2
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push to Apps Script
        run: clasp push --force
